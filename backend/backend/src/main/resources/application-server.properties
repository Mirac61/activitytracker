spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/activitytracker
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
weatherapi_key=${weatherapi_key}
weatherapi_city=${weatherapi_city}
keycloak.serverUrl=http://localhost:8081
keycloak.realm=ActivityTracker
keycloak.adminRealm=master
keycloak.clientId=admin-cli
keycloak.adminUser=${KEYCLOAK_ADMIN_USER}
keycloak.adminPassword=${KEYCLOAK_ADMIN_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ActivityTracker
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${KEYSTORE_PATH:file:/app/keystore.p12}
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot